<tars>
    <application>
        <client>
            # 同步调用的超时时间，单位为毫秒
            sync-invoke-timeout = 5000

            # 服务地址刷新间隔，单位为毫秒
            refresh-endpoint-interval = 10000

            # 客户端网络线程数量
            netthread = 1

            # 当前模块名称
            modulename = MathApp.CalculatorServer
        </client>

        <server>
            # 保留终端输出，方便观察启动信息
            closecout = 0

            # Tars 应用名称
            app = MathApp

            # Tars 服务名称
            server = CalculatorServer

            # 服务基础目录
            basepath = ./

            # 服务运行数据目录
            datapath = ./runtime/data/

            # 服务日志目录
            logpath = ./runtime/logs/

            # 服务端网络线程数量
            netthread = 1

            <CalculatorAdapter>
                # 使用 TCP 监听服务器本机的 20002 端口
                endpoint = tcp -h 127.0.0.1 -p 20002 -t 10000

                # 不额外限制客户端 IP
                allow =

                # 最大连接数量
                maxconns = 100

                # 业务处理线程数量
                threads = 1

                # 完整的 Tars 服务对象名称
                servant = MathApp.CalculatorServer.CalculatorObj

                # 请求等待队列容量
                queuecap = 1000

                # 使用 Tars RPC 协议
                protocol = tars
            </CalculatorAdapter>
        </server>
    </application>
</tars>